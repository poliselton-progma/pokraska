<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Покраска">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>Покраска</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--bd:#e5e7eb;--gr:#16a34a;--rd:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f17;--card:#171c26;--tx:#f3f4f6;--mu:#9ca3af;--ac:#3b82f6;--bd:#283041;--gr:#4ade80;--rd:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}
input{width:100%;font-size:16px;padding:11px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;text-align:left;line-height:1.2}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
button{font-size:16px;border:0;border-radius:10px;padding:12px;background:var(--ac);color:#fff;width:100%;font-weight:600}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mon button{width:44px;padding:8px}.mon b{font-size:18px;text-transform:capitalize}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
.row:last-child{border:0}.mu{color:var(--mu);font-size:14px}.sum{font-weight:700;white-space:nowrap}
.x{background:none;border:1px solid var(--rd);color:var(--rd);width:auto;padding:8px 10px;margin-left:10px;font-size:18px;line-height:1}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.big{font-size:26px;font-weight:800}
.g{color:var(--gr)}.r{color:var(--rd)}
.lab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.lab input{width:45%;margin:0;text-align:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--mu);border-radius:0;font-size:13px;padding:12px 4px}
nav button.on{color:var(--ac)}
.tab{display:none}.tab.on{display:block}
.ex{background:#6b7280;margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 12px}.chk input{width:22px;height:22px;margin:0}
.x.e{border-color:var(--mu);color:var(--mu);margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="mon"><button onclick="shift(-1)">‹</button><b id="mname"></b><button onclick="shift(1)">›</button></div>

  <div id="t0" class="tab on">
    <div class="card">
      <h2 id="otitle">Новый заказ</h2>
      <input id="oname" placeholder="Название заказа">
      <input id="osum" type="number" inputmode="decimal" placeholder="Сумма">
      <input id="ophone" type="tel" placeholder="Телефон">
      <input id="odate" type="date">
      <label class="chk"><input type="checkbox" id="ocard"> Безнал (вычесть 8%)</label>
      <button id="obtn" onclick="addOrder()">Добавить заказ</button>
      <button id="ocancel" class="ex" style="display:none" onclick="resetForm()">Отмена</button>
    </div>
    <div class="card"><div class="tot"><span>Итого за месяц</span><span id="otot"></span></div></div>
    <div class="card" id="olist"></div>
  </div>

  <div id="t1" class="tab">
    <div class="card">
      <h2>Зарплата за неделю</h2>
      <div class="mu" style="margin-bottom:8px">Вноси в пятницу — дата подставится сама</div>
      <input id="wdate" type="date">
      <input id="w1" type="number" inputmode="decimal" placeholder="Зп маляр">
      <input id="w2" type="number" inputmode="decimal" placeholder="Зп помощник 1">
      <input id="w3" type="number" inputmode="decimal" placeholder="Зп помощник 2">
      <button onclick="addWeek()">Добавить</button>
    </div>
    <div class="card"><div class="tot"><span>Всего за месяц</span><span id="wtot"></span></div></div>
    <div class="card" id="wlist"></div>
  </div>

  <div id="t2" class="tab">
    <div class="card">
      <h2>Расходы месяца</h2>
      <div id="exp"></div>
    </div>
    <div class="card">
      <h2>Сводка</h2>
      <div class="lab"><span>Сумма заказов</span><b id="s1"></b></div>
      <div class="lab"><span>Зарплаты (по неделям)</span><b id="s4" class="r"></b></div>
      <div class="lab"><span>Расходы месяца</span><b id="s2" class="r"></b></div>
      <div class="lab"><span>Чистая прибыль</span><span class="big" id="s3"></span></div>
    </div>
    <div class="card">
      <button class="ex" onclick="exportData()">Скопировать резервную копию</button>
      <button class="ex" onclick="importData()">Восстановить из копии</button>
    </div>
  </div>
</div>

<nav>
  <button class="on" onclick="tab(0,this)">📋<br>Заказы</button>
  <button onclick="tab(1,this)">💵<br>Недели</button>
  <button onclick="tab(2,this)">📊<br>Итоги</button>
</nav>

<script>
const KEY='paint_v1';
const FIELDS=[['paint','Затраты на краску'],['rent','Аренда'],['el','Электроэнергия'],['oth','Прочие расходы']];
let D=load(), cur=new Date(); cur.setDate(1);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],weeks:[],exp:{}}}catch(e){return{orders:[],weeks:[],exp:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const $=id=>document.getElementById(id);
const f=n=>(Math.round(n*100)/100).toLocaleString('ru-RU');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=d=>d.slice(0,7);
const curKey=()=>cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s.split('-').reverse().join('.');
function shift(n){cur.setMonth(cur.getMonth()+n);render()}
function tab(i,b){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',i==j));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
let editId=null;
const eff=x=>x.sum==null?0:(x.card?x.sum*0.92:x.sum);
const amt=x=>x.sum==null?'<span class="mu">без суммы</span>':(x.card?f(x.sum*0.92)+'<div class="mu" style="font-weight:400">безнал, из '+f(x.sum)+'</div>':f(x.sum));
function resetForm(){
  editId=null;$('oname').value=$('osum').value=$('ophone').value='';$('ocard').checked=false;$('odate').value=today();
  $('otitle').textContent='Новый заказ';$('obtn').textContent='Добавить заказ';$('ocancel').style.display='none';
}
function edit(id){
  const x=D.orders.find(o=>o.id===id);if(!x)return;
  editId=id;$('oname').value=x.name;$('osum').value=x.sum==null?'':x.sum;$('ophone').value=x.phone||'';
  $('odate').value=x.date;$('ocard').checked=!!x.card;
  $('otitle').textContent='Редактирование заказа';$('obtn').textContent='Сохранить изменения';$('ocancel').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function addOrder(){
  const name=$('oname').value.trim(),raw=$('osum').value.trim();
  if(!name){alert('Введи название заказа');return}
  const sum=raw===''?null:parseFloat(raw);
  const o={name,sum:isNaN(sum)?null:sum,card:$('ocard').checked,phone:$('ophone').value.trim(),date:$('odate').value||today()};
  if(editId){const i=D.orders.findIndex(x=>x.id===editId);if(i>-1)D.orders[i]={...D.orders[i],...o}}
  else D.orders.push({id:Date.now(),...o});
  save();resetForm();render();
}
function addWeek(){
  const pain=parseFloat($('w1').value)||0,h1=parseFloat($('w2').value)||0,h2=parseFloat($('w3').value)||0,sum=pain+h1+h2;
  if(!sum){alert('Введи хотя бы одну зарплату');return}
  D.weeks.push({id:Date.now(),pain,h1,h2,sum,date:$('wdate').value||today()});
  save();$('w1').value=$('w2').value=$('w3').value='';render();
}
function del(kind,id){if(confirm('Удалить?')){D[kind]=D[kind].filter(x=>x.id!==id);save();render()}}
function setExp(k,v){const m=curKey();D.exp[m]=D.exp[m]||{};D.exp[m][k]=parseFloat(v)||0;save();summary()}
function summary(){
  const m=curKey(),o=D.orders.filter(x=>mk(x.date)==m).reduce((a,x)=>a+eff(x),0);
  const e=Object.values(D.exp[m]||{}).reduce((a,x)=>a+x,0);
  const w=D.weeks.filter(x=>mk(x.date)==m).reduce((a,x)=>a+x.sum,0);
  $('s1').textContent=f(o);$('s2').textContent=f(e);$('s4').textContent=f(w);
  const p=o-e-w;$('s3').textContent=f(p);$('s3').className='big '+(p>=0?'g':'r');
}
function render(){
  const m=curKey();
  $('mname').textContent=cur.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  if(!$('odate').value)$('odate').value=today();
  if(!$('wdate').value)$('wdate').value=today();
  const os=D.orders.filter(x=>mk(x.date)==m).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('otot').textContent=f(os.reduce((a,x)=>a+eff(x),0));
  $('olist').innerHTML=os.length?os.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="mu">${fmtD(x.date)}${x.phone?' · <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a>':''}</div></div><div style="display:flex;align-items:center"><span class="sum" style="text-align:right">${amt(x)}</span><button class="x e" onclick="edit(${x.id})">✏️</button><button class="x" onclick="del('orders',${x.id})">🗑</button></div></div>`).join(''):'<div class="mu">Заказов пока нет</div>';
  const ws=D.weeks.filter(x=>mk(x.date)==m).sort((a,b)=>b.date.localeCompare(a.date));
  $('wtot').textContent=f(ws.reduce((a,x)=>a+x.sum,0));
  $('wlist').innerHTML=ws.length?ws.map(x=>`<div class="row"><div><b>Неделя до ${fmtD(x.date)}</b>${x.pain!=null?'<div class="mu">Маляр '+f(x.pain)+' · П1 '+f(x.h1)+' · П2 '+f(x.h2)+'</div>':''}</div><div style="display:flex;align-items:center"><span class="sum">${f(x.sum)}</span><button class="x" onclick="del('weeks',${x.id})">🗑</button></div></div>`).join(''):'<div class="mu">Записей нет</div>';
  const ex=D.exp[m]||{};
  $('exp').innerHTML=FIELDS.map(([k,l])=>`<div class="lab"><span>${l}</span><input type="number" inputmode="decimal" placeholder="0" value="${ex[k]||''}" oninput="setExp('${k}',this.value)"></div>`).join('');
  summary();
}
function exportData(){const s=JSON.stringify(D);(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>alert('Скопировано. Вставь в заметки и сохрани.')).catch(()=>prompt('Скопируй текст:',s))}
function importData(){const s=prompt('Вставь резервную копию:');if(!s)return;try{const d=JSON.parse(s);if(d.orders&&d.weeks){D=d;save();render()}else alert('Неверный формат')}catch(e){alert('Ошибка чтения')}}
render();
</script>
</body>
</html>
